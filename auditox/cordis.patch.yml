# AuditOx product overlay for the local-first web profile.
# Apply with:
#   dsh --profile web --patch ./auditox/cordis.patch.yml

# The product is local-first: no DeepSeek account gate, cloud model route or
# unused preset should appear in the AuditOx workspace.

- id: remote-connection
  disabled: true

- id: client-ui-action-cards
  disabled: true

- id: creation-recommendations
  disabled: true

- id: client-ui-creation-recommendations
  disabled: true

- id: plugin-recommendations
  disabled: true

- id: client-ui-plugin-recommendations
  disabled: true

- id: ui-settings-session-log
  disabled: true
- id: ui-settings-account
  disabled: true

- id: ui-account-notifications
  disabled: true

- id: ui-settings-models
  config:
    credentialOnboarding: false

- id: preset-ptc
  disabled: true

- id: preset-minimal
  disabled: true

- id: preset-cordis
  disabled: true

- id: deepseek-account
  disabled: true

- id: deepseek-auth
  disabled: true

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: web-deepseek-api
  disabled: true

- id: agent-preset-registry
  config:
    default: auditox

- id: ui-brand-official
  disabled: true

# Ollama exposes an OpenAI-compatible endpoint. It is keyless on localhost;
# no API key is fabricated for the local provider.
- id: llm-pi-ai
  config:
    providers:
      auditox-local:
        displayName: 审小牛本地模型
        api: openai-completions
        baseURL: http://127.0.0.1:11435/v1
        defaultContextWindow: 32768
        defaultMaxTokens: 8192
        models:
          - id: auditox-custom
            name: 当前本地模型
            contextWindow: 32768
            maxTokens: 8192
            input: [text, image]
          - id: qwen3.5:2b
            name: Qwen3.5 2B 本地
            contextWindow: 32768
            maxTokens: 8192
            input: [text]
          - id: qwen3.5:4b
            name: Qwen3.5 4B 本地
            contextWindow: 32768
            maxTokens: 8192
            input: [text]
          - id: qwen3.5:9b
            name: Qwen3.5 9B 本地
            contextWindow: 32768
            maxTokens: 8192
            input: [text]
          - id: qwen2.5vl:3b
            name: Qwen2.5-VL 3B 本地
            contextWindow: 32768
            maxTokens: 8192
            input: [text, image]
          - id: qwen2.5vl:7b
            name: Qwen2.5-VL 7B 本地
            contextWindow: 32768
            maxTokens: 8192
            input: [text, image]
          - id: minicpm-v:8b
            name: MiniCPM-V 8B 本地
            contextWindow: 32768
            maxTokens: 8192
            input: [text, image]

- id: agent-default-model
  config:
    provider: auditox-local
    model: auditox-custom

# The guided AuditOx mode replaces the upstream standard preset. The second
# AuditOx preset is a direct conversation mode for ordinary audit questions.
- id: preset-standard
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: auditox
    name: 审小牛引导审计
    description: 以财务报表和账套资料为起点，生成计划、重要性、程序、控制测试、实质性底稿与复核包。
    order: 0
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: |-
            You are 审小牛 AuditOx, a Chinese annual-audit project assistant working inside a local data-controlled Harness.
            Load the global workpaper standard before drafting any workpaper. Separate facts, inferences and items awaiting client confirmation.
            Never fabricate amounts, evidence, control existence, laws or audit conclusions. Deterministic calculations and evidence remain authoritative.
            Use AuditOx project tools for file registration, project state and guided stages. The final judgment belongs to the audit engagement team and signing partner.
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
        config:
          includeDefaultRoots: true
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: tool-auditox-runtime
        name: '@deepseek-ai/dsh-tool-auditox-runtime'
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: false
      - id: tool-office
        name: '@deepseek-ai/dsh-tool-office'
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |-
                你现在处于审计计划模式。先厘清项目范围、报表口径、已知资料和待补资料，再形成可复核的审计计划。不得编造金额、审计证据或审计结论。只有项目组确认计划后，才进入实质性执行。
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'

- insert:
    - id: preset-auditox-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: auditox-chat
        name: 审小牛对话审计
        description: 直接与审小牛讨论审计问题、解释报表、整理资料清单和复核发现。
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are 审小牛 AuditOx in conversation mode. Answer audit questions in Chinese, distinguish evidence from inference, and never invent balances, evidence or conclusions.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: true
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-auditox-runtime
            name: '@deepseek-ai/dsh-tool-auditox-runtime'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: false
          - id: tool-office
            name: '@deepseek-ai/dsh-tool-office'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    - id: auditox-local-services
      name: '@deepseek-ai/dsh-auditox-local-services'

    - id: ui-brand-auditox
      name: '@deepseek-ai/dsh-client-ui-brand-auditox'

    - id: ui-auditox-workbench
      name: '@deepseek-ai/dsh-client-ui-auditox-workbench'
