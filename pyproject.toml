[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiauditox-agent"
version = "0.1.0"
description = "AIAuditOx 审计 Agent 运行时：技能驱动、确定性工具优先、证据可追溯"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC-BY-NC-SA-4.0" }
authors = [{ name = "何小疯27" }]
keywords = ["audit", "agent", "workpaper", "auditox"]

dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "SQLAlchemy>=2.0,<3",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "openpyxl>=3.1,<4",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "httpx>=0.27,<1",
]

[project.scripts]
auditox = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "api*", "cli*", "adapters*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "e2e: 端到端测试",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["agent", "api", "cli", "adapters"]
omit = ["tests/*", "*/__init__.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
